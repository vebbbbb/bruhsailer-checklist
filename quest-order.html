":50000}},{"type":"train","skill":"Construction","lvl":70},{"type":"train","skill":"Farming","lvl":70},{"type":"train","skill":"Herblore","lvl":70},{"type":"train","skill":"Hunter","lvl":70},{"type":"row","id":"Song of the Elves","name":"Song of the Elves","qp":4,"loc":"Tirannwn","link":"Song of the Elves","xp":{"Agility":40000,"Construction":40000,"Farming":40000,"Herblore":40000,"Hunter":40000,"Mining":40000,"Smithing":40000,"Woodcutting":40000},"info":["To obtain a runite bar, get one as a guaranteed drop from rune dragons, or exchange rune platelegs at the Aldarin windmill nest. Rune platelegs can be purchased at Scavvo's Rune Store in the Champions' Guild for 64,000 coins."]},{"type":"train","skill":"Firemaking","lvl":75},{"type":"train","skill":"Runecraft","lvl":60},{"type":"row","id":"Desert Treasure II - The Fallen Empire","name":"Desert Treasure II - The Fallen Empire","qp":5,"loc":"Kharidian Desert","link":"Desert Treasure II - The Fallen Empire","xp":{"Prayer":300000},"info":["Use the ancient lamps on any combat skill: it is generally recommended to put them on Prayer as the hardest skill to train if you plan to train it."]},{"type":"train","skill":"Slayer","lvl":74},{"type":"train","skill":"Woodcutting","lvl":74},{"type":"train","skill":"Smithing","lvl":72},{"type":"train","skill":"Cooking","lvl":72},{"type":"train","skill":"Fletching","lvl":70},{"type":"row","id":"The Blood Moon Rises","name":"The Blood Moon Rises","qp":4,"loc":"Meiyerditch","link":"The Blood Moon Rises","xp":{"Herblore":180000},"info":["Use the six experience tomes on any skill(s) of your choosing above level 70. Herblore is selected here."]},{"type":"header","text":"All  quest XP rewards from this point do not impact any other quests, and therefore require no specific order of completion."},{"type":"row","id":"The Corsair Curse","name":"The Corsair Curse","qp":2,"loc":"Port Sarim","link":"The Corsair Curse"},{"type":"header","text":"Quest point cape!"}];
const KEY="bruhsailer-quest-order";
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const slug=(q)=>q.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const list=document.getElementById("list");
function row(k,name,step,note,lamp,diary){
  const li=document.createElement("li");
  const lab=document.createElement("label");
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!done[k];cb.className="main";cb.dataset.k=k;
  const q=document.createElement("span");q.className="q";q.textContent=name+" ";
  if(diary){const t=document.createElement("span");t.className="tag";t.textContent="Diary";q.prepend(t)}
  if(note){const em=document.createElement("em");em.textContent="("+note+")";q.appendChild(em)}
  if(lamp){const l=document.createElement("span");l.className="lamp";l.innerHTML="Lamp → <b></b>";l.querySelector("b").textContent=lamp;q.appendChild(l)}
  lab.append(cb,q);
  if(step){const s=document.createElement("span");s.className="step";s.textContent=step;lab.appendChild(s)}
  li.appendChild(lab);li.classList.toggle("isdone",cb.checked);if(diary)li.classList.add("diary");
  cb.addEventListener("change",()=>{if(cb.checked)done[k]=1;else delete done[k];li.classList.toggle("isdone",cb.checked);save();update()});
  return li;
}
function section(title){
  const sec=document.createElement("section");
  const h=document.createElement("h2");h.innerHTML="<div></div><span></span>";h.firstChild.textContent=title;
  sec.appendChild(h);return sec;
}
const TITLES={sailing:"Sailing log",oq:"Optimal quest order"};
let tab="oq";try{tab=localStorage.getItem(KEY+"-tab")||"oq"}catch(e){}
if(!TITLES[tab])tab="oq";
function render(){
  list.innerHTML="";
  document.getElementById("title").textContent=TITLES[tab];
  document.title=TITLES[tab];
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(tab==="oq"){
    renderOQ();
  }else{
    SAILING.forEach(([title,step,items])=>{
      const sec=section(title+"  ("+step+")"),ul=document.createElement("ul");
      items.forEach(([n,,note])=>ul.appendChild(row("s-"+step+"-"+slug(n),n,"",note)));
      sec.appendChild(ul);list.appendChild(sec);
    });
  }
  update();
}

const WIKI="https://oldschool.runescape.wiki/w/";
const fmt=n=>Number(n).toLocaleString("en-US");
function oqKey(o){
  const m=o.id.match(/^(Easy|Medium) (.+) Diary$/);
  if(m) return "d-"+slug(m[2]+" "+m[1].toLowerCase());
  return slug(o.id);
}
let oqFilter="";
const CATS=[["quest","Quests"],["diary","Diaries"],["train","Training"],["unlock","Unlocks"]];
let oqCats={quest:true,diary:true,train:false,unlock:false};
try{const s=JSON.parse(localStorage.getItem(KEY+"-oqcats")||"null");if(s)oqCats=Object.assign(oqCats,s)}catch(e){}
const catOf=o=>o.type==="train"?"train":/Diary|Diaries/.test(o.id)?"diary":/^Unlock:/.test(o.name)?"unlock":"quest";
const SPLITS={"Holy Grail":"Holy Grail → Dragon Slayer I","Dragon Slayer I":"Dragon Slayer I → Desert Treasure I","Desert Treasure I":"Desert Treasure I → 85 combat"};
function renderOQ(){
  const intro=document.createElement("p");intro.className="sub";
  intro.innerHTML='From the <a style="color:var(--gold)" target="_blank" rel="noopener" href="https://oldschool.runescape.wiki/w/Optimal_quest_guide/Ironman">OSRS Wiki optimal quest guide (Ironman)</a>.';
  list.appendChild(intro);
  const tools=document.createElement("div");tools.className="oqtools";
  const search=document.createElement("input");search.type="search";search.placeholder="Filter quests…";search.value=oqFilter;search.setAttribute("aria-label","Filter quests");
  const next=document.createElement("button");next.className="tool";next.textContent="Jump to next";
  tools.append(search,next);list.appendChild(tools);
  const chips=document.createElement("div");chips.className="chips";chips.setAttribute("aria-label","Show types");
  const counts={};OQ.forEach(o=>{if(o.type!=="header"){const c=catOf(o);counts[c]=(counts[c]||0)+1}});
  CATS.forEach(([c,label])=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",!!oqCats[c]);
    b.innerHTML=label+'<span class="c"></span>';b.querySelector(".c").textContent=counts[c]||0;
    b.onclick=()=>{oqCats[c]=!oqCats[c];b.setAttribute("aria-pressed",oqCats[c]);try{localStorage.setItem(KEY+"-oqcats",JSON.stringify(oqCats))}catch(e){}applyCats()};
    chips.appendChild(b);
  });
  list.appendChild(chips);
  const parts=[{title:"Start → Holy Grail",rows:[]}];
  let n=0,ti=0;
  OQ.forEach(o=>{
    if(o.type==="header"){
      if(/^Quest point cape/.test(o.text)) return;
      parts.push({title:/^Train/.test(o.text)?"Train combat to 85 (Slayer to 69 for efficiency)":"Any order (XP no longer matters)",rows:[]});return;
    }
    parts[parts.length-1].rows.push(o);
    if(o.type==="row"&&SPLITS[o.id]) parts.push({title:SPLITS[o.id],rows:[]});
  });
  parts.forEach(pt=>{
    const sec=section(pt.title),ul=document.createElement("ul");
    pt.rows.forEach(o=>{
      if(o.type==="train"){
        const li=row("oq-train-"+slug(o.skill)+"-"+o.lvl+"-"+(ti++),"Train "+o.skill+" to "+o.lvl,"","",null,false);
        li.classList.add("train");
        const t=document.createElement("span");t.className="tag";t.textContent="Train";li.querySelector(".q").prepend(t);
        li.dataset.search=("train "+o.skill).toLowerCase();li.dataset.cat="train";
        ul.appendChild(li);return;
      }
      n++;
      const k=oqKey(o);
      const li=row(k,o.name,"","",null,/Diary|Diaries/.test(o.id));
      li.dataset.search=(o.name+" "+(o.loc||"")).toLowerCase();li.dataset.cat=catOf(o);
      const lab=li.querySelector("label"),q=li.querySelector(".q");
      const num=document.createElement("span");num.className="num";num.textContent=n;lab.insertBefore(num,lab.firstChild);
      if(o.qp){const b=document.createElement("span");b.className="qpb";b.textContent=o.qp+" QP";lab.appendChild(b)}
      const meta=document.createElement("span");meta.className="meta";
      const bits=[];
      if(o.loc) bits.push(o.loc);
      if(o.xp) bits.push(Object.entries(o.xp).map(([s,v])=>s+" +"+fmt(v)).join(", "));
      meta.textContent=bits.join("  |  ")+(bits.length?"  ":"");
      if(o.link){const a=document.createElement("a");a.href=WIKI+encodeURIComponent(o.link.replace(/ /g,"_"));a.target="_blank";a.rel="noopener";a.textContent="Wiki";a.addEventListener("click",e=>e.stopPropagation());meta.appendChild(a)}
      q.appendChild(meta);
      const steps=o.steps||[],info=o.info||[];
      if(steps.length||info.length){
        const btn=document.createElement("button");btn.className="more";btn.type="button";
        btn.textContent=steps.length?("Steps ("+steps.length+")"):"Notes";
        btn.setAttribute("aria-expanded","false");
        const det=document.createElement("div");det.className="det";
        info.forEach(t=>{const p=document.createElement("p");p.textContent=t;det.appendChild(p)});
        if(steps.length){
          const sul=document.createElement("ul");
          steps.forEach(([d,t],i)=>{
            const sk="oq-s-"+slug(o.id)+"-"+i;
            const sli=document.createElement("li");if(d>1)sli.classList.add("d2");
            const sl=document.createElement("label");
            const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!done[sk];cb.dataset.k=sk;
            const sq=document.createElement("span");sq.className="q";sq.textContent=t;
            sl.append(cb,sq);sli.appendChild(sl);sli.classList.toggle("isdone",cb.checked);
            cb.addEventListener("change",()=>{if(cb.checked)done[sk]=1;else delete done[sk];sli.classList.toggle("isdone",cb.checked);save()});
            sul.appendChild(sli);
          });
          det.appendChild(sul);
        }
        btn.onclick=()=>{const op=det.classList.toggle("open");btn.setAttribute("aria-expanded",op)};
        li.append(btn,det);
      }
      ul.appendChild(li);
    });
    sec.appendChild(ul);list.appendChild(sec);
  });
  const applyFilter=()=>{
    oqFilter=search.value.trim().toLowerCase();
    list.querySelectorAll("section > ul > li").forEach(li=>{li.style.display=(!oqFilter||(li.dataset.search||"").includes(oqFilter))?"":"none"});
  };
  const applyCats=()=>{
    list.querySelectorAll("section > ul > li").forEach(li=>li.classList.toggle("cat-hidden",!oqCats[li.dataset.cat]));
    list.querySelectorAll("section").forEach(sec=>sec.classList.toggle("empty",!sec.querySelector(":scope > ul > li:not(.cat-hidden)")));
    update();
  };
  search.addEventListener("input",applyFilter);applyFilter();applyCats();
  next.onclick=()=>{
    const li=[...list.querySelectorAll("section > ul > li")].find(l=>!l.querySelector("input.main").checked&&l.style.display!=="none"&&!l.classList.contains("cat-hidden"));
    if(!li)return;
    const hh=document.querySelector("header").offsetHeight;
    window.scrollTo({top:li.getBoundingClientRect().top+window.scrollY-hh-12,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    li.classList.add("flash");setTimeout(()=>li.classList.remove("flash"),1600);
  };
}
function update(){
  let all=0,n=0;
  list.querySelectorAll("section").forEach(sec=>{
    const vis=[...sec.querySelectorAll(":scope > ul > li:not(.cat-hidden) > label > input.main")];
    const b=vis,c=vis.filter(x=>x.checked);
    sec.querySelector("h2 span").textContent=c.length+" / "+b.length;
    all+=b.length;n+=c.length;
  });
  document.getElementById("total").textContent=n+" of "+all+" done";
  document.getElementById("fill").style.width=(all?n/all*100:0)+"%";
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;try{localStorage.setItem(KEY+"-tab",tab)}catch(e){}render();window.scrollTo(0,0)});
render();
const hideBtn=document.getElementById("hideBtn");
let hide=false;try{hide=localStorage.getItem(KEY+"-hide")==="1"}catch(e){}
function applyHide(){document.body.classList.toggle("hide",hide);hideBtn.setAttribute("aria-pressed",hide);hideBtn.textContent=hide?"Show completed":"Hide completed"}
applyHide();
hideBtn.onclick=()=>{hide=!hide;try{localStorage.setItem(KEY+"-hide",hide?"1":"0")}catch(e){}applyHide()};
document.getElementById("resetBtn").onclick=()=>{
  const msg="Uncheck everything on this tab?";
  if(!confirm(msg))return;
  list.querySelectorAll("input[type=checkbox]").forEach(c=>{if(c.closest(".cat-hidden"))return;c.checked=false;delete done[c.dataset.k];const li=c.closest("li");if(li)li.classList.remove("isdone")});
  save();update();
};
</script>
