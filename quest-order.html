<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest order &amp; sailing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b2318; --panel:#3e3529; --edge:#1c160f; --ink:#e8dcc0; --muted:#a8987a;
  --todo:#ff5a4a; --done:#3fd14a; --gold:#ffcf3a; --rowhover:#4a3f30;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#d8cbb0; --panel:#efe5cf; --edge:#8a7556; --ink:#2b2318; --muted:#6b5a40;
    --todo:#b3261e; --done:#1f7a2a; --gold:#8a5a00; --rowhover:#e4d7bb;
  }
}
:root[data-theme="dark"]{
  --bg:#2b2318; --panel:#3e3529; --edge:#1c160f; --ink:#e8dcc0; --muted:#a8987a;
  --todo:#ff5a4a; --done:#3fd14a; --gold:#ffcf3a; --rowhover:#4a3f30;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 60px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:10px 0 12px}
.backlink{display:inline-flex;align-items:center;gap:6px;font:700 .85rem "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted);text-decoration:none;padding:4px 0}
.backlink:hover{color:var(--gold)}
h1{font:700 1.9rem/1.1 "Pixelify Sans",system-ui,sans-serif;color:var(--gold);margin:4px 0 4px;text-shadow:2px 2px 0 var(--edge)}
.total{font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted)}
.bar{height:10px;background:var(--edge);border:2px solid var(--edge);margin-top:8px}
.bar>i{display:block;height:100%;background:var(--done);width:0;transition:width .25s}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.tool{font:500 .95rem "Pixelify Sans",system-ui,sans-serif;background:var(--panel);color:var(--ink);border:2px solid var(--edge);padding:6px 12px;cursor:pointer}
button.tool[aria-pressed="true"]{color:var(--gold)}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;font:700 1.05rem "Pixelify Sans",system-ui,sans-serif;background:var(--panel);color:var(--muted);border:3px solid var(--edge);border-bottom-width:5px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.sub{color:var(--muted);font-size:.9rem;padding:8px 12px 0;margin:0}
.tag{display:inline-block;font:700 .7rem/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:0 5px;margin-right:6px;vertical-align:2px}
.lamp{display:block;color:var(--muted);font-size:.85rem;margin-top:1px}
.lamp b{color:var(--gold);font-weight:700}
li.diary label{background:rgba(255,207,58,.05)}
.oqtools{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.oqtools input{flex:1;min-width:160px;font:16px "Atkinson Hyperlegible",system-ui,sans-serif;background:var(--panel);color:var(--ink);border:2px solid var(--edge);padding:6px 10px}
.num{color:var(--muted);font-size:.8rem;min-width:2.2em;text-align:right;flex:none}
.meta{display:block;color:var(--muted);font-size:.82rem;margin-top:1px}
.meta a{color:var(--gold)}
.qpb{color:var(--gold);font-size:.8rem;font-weight:700;white-space:nowrap}
li.train label{background:rgba(255,207,58,.05)}
.more{font:700 .8rem "Atkinson Hyperlegible",system-ui,sans-serif;background:none;border:1px solid var(--edge);color:var(--muted);padding:2px 8px;margin:0 12px 6px 56px;cursor:pointer}
.more[aria-expanded="true"]{color:var(--gold);border-color:var(--gold)}
.det{display:none;margin:0 12px 10px 44px;border-left:2px solid var(--edge);padding-left:4px}
.det.open{display:block}
.det p{margin:4px 8px;color:var(--muted);font-size:.88rem}
.det li label{padding:4px 8px;font-size:.9rem;color:var(--ink)}
.det li.d2 label{padding-left:28px}
.det li input:checked + .q{color:var(--muted)}
body.hide .det li.isdone{display:none}
li.flash label{outline:2px solid var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chips button{font:700 .85rem "Atkinson Hyperlegible",system-ui,sans-serif;background:var(--panel);color:var(--muted);border:2px solid var(--edge);padding:4px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.chips button .c{font-weight:400;opacity:.8;margin-left:4px}
li.cat-hidden{display:none!important}
section.empty{display:none}
section{background:var(--panel);border:3px solid var(--edge);margin-top:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
section h2{font:700 1.05rem/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;margin:0;padding:10px 12px;border-bottom:2px solid var(--edge);display:flex;justify-content:space-between;gap:10px;color:var(--gold)}
section h2 span{color:var(--muted);font-weight:500;white-space:nowrap}
ul{list-style:none;margin:0;padding:4px 0}
li label{display:flex;align-items:baseline;gap:10px;padding:7px 12px;cursor:pointer;color:var(--todo)}
li label:hover{background:var(--rowhover)}
li input{width:18px;height:18px;accent-color:var(--done);flex:none;transform:translateY(3px)}
li input:checked + .q{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.q{flex:1}
.q em{color:var(--muted);font-style:normal;font-size:.85em}
.step{color:var(--muted);font-size:.85rem;white-space:nowrap}
body.hide li.isdone{display:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="backlink" href="index.html">&larr; BRUHsailer Checklist</a>
  <h1 id="title">Optimal quest order</h1>

</header>
<main id="list"></main>
</div>

const OQ=[{"type":"row","id":"Learning the Ropes","name":"Learning the Ropes","qp":1,"loc":"Lumbridge","link":"Learning the Ropes","xp":{"Hitpoints":1154},"steps":[[1,"Pickpocket a nearby man for an easy Lumbridge Diary task."],[1,"Buy a spade from the Lumbridge General Store, using 3 coins from the coin pouch you just pickpocketed."],[1,"Start X Marks the Spot by speaking to Veos in The Sheared Ram."],[1,"Dig by Bob's Axe Shop for X Marks the Spot."],[1,"Learn your age from Hans for an easy Lumbridge Diary task. He can be found patrolling around the outside of the castle."],[1,"Dig behind Lumbridge Castle for X Marks the Spot. Kill a nearby giant rat and take the raw rat meat for Druidic Ritual. Pick up the bones for an easy Varrock Diary task."],[1,"Bank your inventory on the 2nd floor (UK) of Lumbridge Castle, keeping only the pot and bucket, in order to have enough inventory space for the following steps."],[1,"Pick up nearby logs until you have at least 17 (world hop to restock) and bank these for Daddy's Home, Tree Gnome Village and Monk's Friend. A total of 65 logs are required to complete all quests."]],"info":["On first arrival in Lumbridge:"]},{"type":"row","id":"Cook's Assistant","name":"Cook's Assistant","qp":1,"loc":"Lumbridge","link":"Cook's Assistant","xp":{"Cooking":300},"steps":[[1,"Start the quest by talking to the Cook in the kitchen on the ground floor. Pick up an additional pot from the nearby table, and a bucket from the Lumbridge Castle cellar."],[1,"Gather the egg, flour, and milk on the west side of the River Lum."],[2,"Fill a second pot of flour at the windmill for an easy Lumbridge Diary task."],[2,"Fill a second bucket of milk at the cow pen for Gertrude's Cat."],[2,"Kill a chicken for feathers for Client of Kourend and raw chicken for Druidic Ritual while in the chicken pen to pick up the egg."],[1,"Before returning to the Cook to complete the quest, start Sheep Shearer by talking to Fred the Farmer and gather 20 wool from the sheep in the nearby pen."],[1,"After quest completion, pick up a bucket from the cellar and fill it at the sink. Use it on your pot of flour to create bread dough. Use the bread dough on the range for an easy Lumbridge Diary task."]]},{"type":"row","id":"Sheep Shearer","name":"Sheep Shearer","qp":1,"loc":"Lumbridge","link":"Sheep Shearer","xp":{"Crafting":200},"steps":[[1,"Spin the wool at the spinning wheel on the 1st floor (UK) of the castle."],[1,"Speak to Duke Horacio on the same floor to start Rune Mysteries."],[1,"Return to Fred the Farmer to complete Sheep Shearer."],[1,"After quest completion, pick an onion from the field behind Fred's house for Witch's Potion."]]},{"type":"row","id":"The Restless Ghost","name":"The Restless Ghost","qp":1,"loc":"Lumbridge","link":"The Restless Ghost","xp":{"Prayer":1125},"steps":[[1,"Start the quest by talking to Father Aereck in the Lumbridge church. Ensure you have not banked your air talisman given to you by Duke Horacio."],[1,"On the way to Father Urhney, stop by the south-eastern corner of Lumbridge Swamp near the fishing spots and speak to Abigale to start Misthalin Mystery. Complete it before continuing."],[1,"After speaking to Father Urhney, pick up the leather gloves, as these are required for numerous quests."],[1,"While at the Wizards' Tower, bring the air talisman to Archmage Sedridor in the basement for the second step of Rune Mysteries."]]},{"type":"row","id":"Misthalin Mystery","name":"Misthalin Mystery","qp":1,"loc":"Lumbridge","link":"Misthalin Mystery","xp":{"Crafting":600},"info":["Complete during The Restless Ghost."]},{"type":"row","id":"X Marks the Spot","name":"X Marks the Spot","qp":1,"loc":"Lumbridge","link":"X Marks the Spot","xp":{"Agility":300},"steps":[[1,"While in Draynor Village:"],[2,"Start Vampyre Slayer by talking to Morgan, taking garlic from the cupboard upstairs for the quest. Take three additional pieces for Fishing Contest, Desert Treasure I and While Guthix Sleeps."],[2,"Do a lap of the Draynor Agility Course for an easy Lumbridge Diary task."],[2,"Bank everything except your coins, onion, and feathers before completing the quest in Port Sarim."]],"info":["After completion of this quest use the 300 experience reward on Agility Agility."]},{"type":"row","id":"Witch's Potion","name":"Witch's Potion","qp":1,"loc":"Rimmington","link":"Witch's Potion","xp":{"Magic":325},"steps":[[1,"From Betty's Magic Emporium buy two eye of newt, one for this quest and one for Another Cook's Quest."],[1,"From Gerrant's Fishy Business, buy a raw sardine for Gertrude's Cat and a fishing bait for Recipe for Disaster/Freeing the Goblin generals."],[1,"From Wydin's Food Store buy 6 pieces of cheese for Witch's House, Ratcatchers and Mourning's End Part II's item list. Buy two pieces of raw beef, one for this quest and one for Druidic Ritual (hop worlds to restock)."],[1,"Burn one raw beef at the range north of the food store for this quest (cook it twice)."]],"info":["While in Port Sarim:"]},{"type":"row","id":"Client of Kourend","name":"Client of Kourend","qp":1,"loc":"Great Kourend","link":"Client of Kourend","xp":{"Agility":1000},"steps":[[1,"While in Shayzien:"],[2,"Pick up the black wizard hat off the table in the clothing shop Shayzien Styles for Shadow of the Storm."],[2,"Pick up 25 bones by the Shayzien West minecart for Demon Slayer - you can bank them at Shayzien to the east."],[1,"When activating the mysterious orb near the Dark Altar, talk to Tyss to change your spellbook to Arceuus spellbook for a medium Kourend & Kebos Diary task. You may change it back after completing the task."],[1,"Return to Port Sarim and talk to Redbeard Frank to start Pirate's Treasure."]],"info":["Use the Minecart network to travel throughout the quest, which costs 20 coins per trip.","After completion of this quest use both 500 experience rewards on AgilityAgility."]},{"type":"row","id":"Pandemonium","name":"Pandemonium","qp":1,"loc":"Port Sarim","link":"Pandemonium","xp":{"Sailing":400},"steps":[[1,"Head north-west to Pandemonium Cave and talk to Chartin' Charles McAtless to receive a spyglass for use in Sea charting."],[1,"Use your spyglass to admire Chartin' Charles McAtless in the Pandemonium Cave."],[1,"Use your spyglass to get a good view of the Pandemonium from the Pandemonium Cave entrance."],[1,"Return to Port Sarim via charter ship."]],"info":["Keep the sawmill coupons from the quest reward for Daddy's Home and other quests requiring planks.","After completing the quest:"]},{"type":"row","id":"Partial completion of Pirate's Treasure","name":"Partially complete: Pirate's Treasure","qp":0,"loc":"Musa Point","link":"Pirate's Treasure","steps":[[1,"Purchase a small fishing net at Gerrant's Fishy Business."],[1,"Travel to Musa Point (Karamja) via charter ship for 30 coins."],[1,"Complete all of the quest steps in Musa Point."],[1,"Fish at the fishing spot to the north for an easy Karamja Diary task."],[1,"Return to Port Sarim via the charter ship to complete another easy Karamja Diary task."],[1,"Complete all of the quest steps in Port Sarim. Keep the White apron for Mourning's End Part II's item list."]]},{"type":"row","id":"Stronghold of Security","name":"Unlock: Stronghold of Security","qp":0,"loc":"Barbarian Village","link":"Stronghold of Security","steps":[[1,"On your way to the Barbarian Village, purchase an inventory of jugs of wine from Fortunato in Draynor Village for 1 coin each, a cheap source of food to help you pass the Stronghold."],[1,"At Barbarian Village climb down the entrance in between the Coal and Tin rocks. Run through dangerous rooms as fast as possible, with auto-retaliate off. This rewards players with 10000 coins from just the first three floors."],[1,"Return to Draynor Village to use some of the coins to purchase the Chronicle, along with 10-15 teleport cards to charge it. This can be used to teleport to the Champions' Guild near Varrock for the following quests."],[1,"While in Draynor Village, also purchase 2 ropes from Ned for Plague City and Waterfall Quest."]],"info":["Requires RuneScape Authenticator to be set."]},{"type":"row","id":"Children of the Sun","name":"Children of the Sun","qp":1,"loc":"Varrock","link":"Children of the Sun","steps":[[1,"Look for a nearby stray dog and use bones on it for an easy Varrock Diary task."],[1,"Purchase 3 silk from Thessalia's Fine Clothes for the easy Ardougne Diary (keep for future quests). Also buy a pink skirt for Prince Ali Rescue."],[1,"Talk to Dr Harlow at the Blue Moon Inn south of the square for Vampyre Slayer. Continue Pirate's Treasure by using the chest key on the chest upstairs. You can now complete the quest the next time the guide takes you to Falador."],[1,"Bring the research package to Aubury in the rune shop to the east of the inn for Rune Mysteries."]],"info":["Allows access to Varlamore.","While in the Varrock town square:"]},{"type":"row","id":"Romeo & Juliet","name":"Romeo & Juliet","qp":5,"loc":"Varrock","link":"Romeo & Juliet","steps":[[1,"Buy a newspaper from Benny in the town square for an easy Varrock Diary task."],[1,"Gather extra cadava berries for Making Friends with My Arm. While there, pick at least 6 redberries from the nearby redberry bush. 6 is the minimum to complete all quests (assuming you purchase red dye from Dyes to Die For later instead of using redberries to create them). Consider getting 6-8 extra as you have a chance to burn redberry pie (world hop to restock the bushes)."]]},{"type":"row","id":"Gertrude's Cat","name":"Gertrude's Cat","qp":1,"loc":"Varrock","link":"Gertrude's Cat","xp":{"Cooking":1525},"steps":[[1,"On your way past the museum complete the Natural history quiz in the Varrock Museum basement."],[1,"Before the Lumber yard step:"],[2,"Start Daddy's Home by talking to Marlo in the house of the Varrock Estate Agent in north-east Varrock."],[2,"Go to Old Man Yarlo's house south-west of Aubury's Rune Shop, talk to him and complete his tasks. Talk to him again and watch the cutscene."],[2,"Now search the crates in the kitchen for three waxwood logs."],[1,"Bring the following for the Lumber Yard step:"],[2,"An Axe"],[2,"Bucket of milk"],[2,"Seasoned sardine, or create them from:"],[3,"Raw sardine, bought from the fishing shop at Port Sarim"],[3,"Doogle leaves, found behind Gertrude's house."],[2,"3 waxwood logs"],[2,"10 logs and 10 sawmill coupons (wood plank) received from the Pandemonium quest"],[2,"3600 coins-4000 coins (+1000 extra if not bringing coupons for the planks)"],[1,"On the way to the Lumber Yard:"],[2,"Talk to Regulus Cento to travel to Civitas illa Fortis and back - this will unlock other transportation methods to Varlamore. Before returning, you may also consider picking up the Black wizard robe from the 2nd floor (UK) of the pub just south of the Quetzal for an early Magic bonus."],[2,"Get waxwood planks, 10 regular planks, 5 bolts of cloth and around 100 bronze nails from the sawmill operator for the final step of Daddy's Home. Also buy 150 steel nails for Dragon Slayer I and Horror from the Deep."],[2,"Cut down a dying tree for an easy Varrock Diary task."],[1,"On your way back to Gertrude to finish the quest, return to Old Man Yarlo to finish Daddy's Home. Bank the steel nails beforehand, or they will be used instead of the bronze nails when constructing the furniture."]],"info":["Allows raising of cats. Raise a kitten to a cat to speed up Recipe for Disaster/Freeing Evil Dave and Ratcatchers. Note: Raw karambwanji is a stackable fish that can be fed to cats. Consider catching some on the next trip to Karamja.","Save the stew reward for The Queen of Thieves, and the chocolate cake for A Tail of Two Cats."]},{"type":"row","id":"Daddy's Home","name":"Daddy's Home (miniquest)","qp":0,"loc":"Varrock","link":"Daddy's Home","xp":{"Construction":944},"steps":[[1,"25 Planks (Keep all of them for future quests; you will need at least 35 planks to complete all quests)"],[1,"50 Mithril nails (Use whenever quests require nails)"],[1,"5 Steel bars (You will need 1 for Prying Times, 2 for In Aid of the Myreque, 4 for One Small Favour, and 6 for Desert Treasure I)"],[1,"10 Oak planks (Keep for Cold War)"],[1,"8 bolts of cloth (Keep 1 for Making Friends with My Arm)"]],"info":["Complete during Gertrude's Cat.","This quest rewards you with:"]},{"type":"row","id":"Natural history quiz","name":"Natural history quiz (miniquest)","qp":0,"loc":"Varrock","link":"Natural history quiz","xp":{"Hunter":1000,"Slayer":1000},"info":["Complete during Gertrude's Cat."]},{"type":"row","id":"Demon Slayer","name":"Demon Slayer","qp":3,"loc":"Varrock","link":"Demon Slayer","steps":[[1,"Start the quest in the Varrock town square, and write down the incantation from the cutscene (differs per player)."],[1,"Complete the quest steps in the Varrock Palace to retrieve two of the three keys."],[1,"Travel to Draynor Village. If you don't already have 25 bones, kill goblins by the jail east of the village."],[1,"Take the bones and research notes from Rune Mysteries and head to the Wizards' Tower."],[1,"Complete Rune Mysteries by talking to Archmage Sedridor in the basement."],[1,"Teleport from Archmage Sedridor to the Rune Essence Mine for an easy Lumbridge Diary task."],[1,"Retrieve the final key for this quest by giving the bones to Wizard Traiborn on the 1st floor (UK)."],[1,"Return to Varrock, taking the three silverlight keys you gathered for Demon Slayer to Sir Prysin to retrieve Silverlight."],[1,"Take food and silverlight to the stone circle by the southern entrance to Varrock and defeat Delrith with the incantation to complete Demon Slayer."]]},{"type":"row","id":"Rune Mysteries","name":"Rune Mysteries","qp":1,"loc":"Lumbridge","link":"Rune Mysteries","info":["Unlocks the ability to use lamps and books of knowledge on the Runecraft skill.","Complete during Demon Slayer."]},{"type":"row","id":"Partial completion of Enter the Abyss","name":"Partially complete: Enter the Abyss","qp":0,"loc":"Varrock","link":"Enter the Abyss","steps":[[1,"Start the quest by talking to the Mage of Zamorak in the Wilderness to the north of the Edgeville slayer master."],[1,"Talk to him again in south-eastern Varrock at the Varrock chaos temple until he gives you a scrying orb."],[1,"With the scrying orb, visit the rune essence mine via Aubury at Aubury's Rune Shop in Varrock to complete the first task. Take a pickaxe and collect 50 rune essence for Priest in Peril, and an additional 21 for Wanted!, The Slug Menace and Garden of Tranquillity."],[1,"Purchase roughly 300+ mind runes from Aubury, as well as 6 air runes, 6 water runes and 6 earth runes for Waterfall Quest. Also purchase an air staff from Zaff. Using wind strike will allow you to safespot for some early game quests like Tree Gnome Village and Fight Arena."]]},{"type":"row","id":"Tree Gnome Village","name":"Tree Gnome Village","qp":2,"loc":"Tree Gnome Village‎","link":"Tree Gnome Village","xp":{"Attack":11450},"steps":[[1,"Bring your coins and 7 logs with you, and travel to Rimmington (you can use the teleport to house tablet you got from Marlo's Crate)."],[1,"Collect three pieces of snape grass at the Hobgoblin Peninsula to the north for Plague City, Skippy and the Mogres and Fairytale I - Growing Pains."],[1,"Use the ship west of Rimmington to travel to Ardougne for 30 coins."],[1,"Walk south-west from Ardougne and enter the Gnome maze to start the quest."],[1,"Purchase a jug to fill with water for Monk's Friend, from Bolkoy's Village Shop upstairs in the centre of the maze."],[1,"After completing this quest, use the spirit tree to teleport to the Battlefield of Khazard and enter the house to the north to start Hazeel Cult."]],"info":["Allows the use of spirit trees.","Optional: Hardcore ironmen may consider completing Witch's House first for the safety of the additional hitpoints."]},{"type":"row","id":"Hazeel Cult","name":"Hazeel Cult","qp":1,"loc":"Ardougne","link":"Hazeel Cult","xp":{"Thieving":1500},"steps":[[1,"After completion of this quest:"],[2,"Steal from the bakery stall in the Ardougne Market until you have one cake for an easy Ardougne Diary task and two breads for Merlin's Crystal and Below Ice Mountain."],[2,"Optional: The bakery stall will be a great source of early food, as cake heals for a total of 12 hitpoints. Consider stocking up on some now before Fight Arena and Waterfall Quest."],[2,"Buy 4 silver bars from the Ardougne Silver Stall (hop worlds to restock) for Nature Spirit, Shadow of the Storm, Creature of Fenkenstrain, and to craft a mind tiara later for an easy Falador Diary task."]],"info":["If siding with Ceril, the quest will be faster but you will need to defeat a level 13 Hazeel Cultist. There will also be two \"rewards\". The first is 5 coins. Find the poison in the cupboard upstairs on the 1st floor (UK) for the second reward: 2,000 coins and 1,500 experience in Thieving.","Siding with Hazeel gives you the full reward at once."]},{"type":"row","id":"Clock Tower","name":"Clock Tower","qp":1,"loc":"Ardougne","link":"Clock Tower","steps":[[1,"Pick up an extra bottle of rat poison for Ratcatchers."]]},{"type":"row","id":"Monk's Friend","name":"Monk's Friend","qp":1,"loc":"Ardougne","link":"Monk's Friend","xp":{"Woodcutting":2000},"steps":[[1,"Get the bucket near Brother Cedric and fill it with water at the well. Use the bucket of water on the empty jug to get a jug of water for this quest."],[1,"After completion of this quest:"],[2,"Take the lit candle from the Ardougne Monastery for retrieving boots of lightness later."],[2,"Take the Battlefield spirit tree to the Tree Gnome Stronghold. Pick some nearby flax for Mourning's End Part II's item list, then retrieve your scrying orb and coins from the nearby bank."],[2,"At Brimstail's cave in the south-western section of the stronghold, have Brimstail teleport you to the rune essence mine with the scrying orb in your inventory for the second Enter the Abyss task."],[2,"Head to the north-western corner of the 1st floor (UK) of the Grand Tree and purchase two buckets of milk, two chocolate dust and four dwellberries from Grand Tree Groceries."],[2,"Use the chocolate dust on the bucket of milk to create two lots of chocolatey milk. Use snape grass on each to create two hangover cures for Plague City and Skippy and the Mogres. Keep the dwellberries for Plague City and The Curse of Arrav."],[2,"Note that you won't be able to return to the Battlefield via the spirit tree. Walk south-east from the stronghold into northern East Ardougne to start Plague City instead."]]},{"type":"row","id":"Plague City","name":"Plague City","qp":1,"loc":"Ardougne","link":"Plague City","xp":{"Mining":2425},"info":["Allows use of the Ardougne teleport spell."]},{"type":"row","id":"Biohazard","name":"Biohazard","qp":3,"loc":"Ardougne","link":"Biohazard","xp":{"Thieving":1250},"steps":[[1,"After beginning the quest and when you are sent near the West Ardougne gate, enter the house to the north and pull the Wilderness lever to complete an easy Ardougne Diary task (pull it again to return)."],[1,"Before leaving Ardougne for Rimmington, take your scrying orb and teleport via Wizard Cromperty to the rune essence mine to complete an easy Ardougne Diary task, as well as the third location for Enter the Abyss. Take the orb along for the rest of the quest to complete Enter the Abyss during it."],[1,"When in Rimmington, buy a sickle mould at Rommik's Crafty Supplies for Nature Spirit (it's useful to buy all available moulds here, like the holy mould)."],[1,"When visiting the Dancing Donkey Inn in Varrock, steal from the tea seller to the north for an easy Varrock Diary task. Keep the cup of tea for The Dig Site."],[1,"During the Dancing Donkey Inn section, hand in your scrying orb to the Mage of Zamorak to complete Enter the Abyss."]],"info":["Keep both priest gown items for use in Shadow of the Storm."]},{"type":"row","id":"Enter the Abyss","name":"Enter the Abyss (miniquest)","qp":0,"loc":"Varrock","link":"Enter the Abyss","xp":{"Runecraft":1000},"info":["Complete during Biohazard."]},{"type":"row","id":"Easy Ardougne Diary","name":"Easy Ardougne Diary","qp":0,"loc":"Ardougne","link":"Ardougne Diary","steps":[[1,"Enter the Combat Training Camp north of West Ardougne."],[1,"Use the altar in the East Ardougne church."],[1,"Check what pets you have insured with Probita."],[1,"Sell silk to the silk trader in the Ardougne Market by offering to sell for 120 coins, then counter his bid with 60 coins."],[1,"Obtain a rusty sword by entering the H.A.M. Hideout north-west of Lumbridge and pickpocketing H.A.M. members. Note: There is a 1/100 chance you will require an additional sword. If you receive buttons, uncut opal, uncut jade, cowhide, or any herbs, keep them for future quests."],[1,"Use the Castle Wars Minigame Teleport and head to Yanille. Visit Aleck's Hunter Emporium for the task, and purchase a bird snare to be used later for an easy Desert Diary task."],[1,"Head to Port Khazard and give your rusty sword and 100 coins to Tindel Marchant."],[1,"Purchase swamp paste at the Khazard General Store for Sea Slug."],[1,"At the mine to the south-west collect 18 copper ore, 14 tin ore and 2 iron ore."],[1,"After mining the ore, board the Fishing Trawler. Once the trawler is out at sea, talk to Murphy to attempt to return to land. After capsizing, climb onto the nearby barrel to return to the mainland."],[1,"Complete the diary by talking to Two-pints at the Flying Horse Inn. After completion, smelt 14 copper and 14 tin ore into bronze bars for Observatory Quest, Prince Ali Rescue, One Small Favour, The Tourist Trap, Creature of Fenkenstrain, Recipe for Disaster/Freeing Pirate Pete, Shilo Village, and Mourning's End Part II's item list. The rest of the ores are for Doric's Quest."],[1,"An infinite teleport to the Ardougne Monastery with close proximity to an altar, spirit tree and fairy ring."],[1,"Double death runes (200) for trading in cats to civilians in West Ardougne."],[1,"Best early obtainable combat stats in the cape slot."]],"info":["Complete the remaining diary tasks in the following order:","Obtaining the Ardougne cloak 1 gives you the following main benefits:","The antique lamp can only be used in a skill over 30 and cannot be banked. If following the guide exactly, it is recommended to put it on Prayer - you should hit level 30 at Priest in Peril."]},{"type":"row","id":"Fight Arena","name":"Fight Arena","qp":2,"loc":"Fight Arena‎","link":"Fight Arena","xp":{"Attack":12175,"Thieving":2175}},{"type":"train","skill":"Thieving","lvl":21},{"type":"row","id":"Tribal Totem","name":"Tribal Totem","qp":1,"loc":"Brimhaven/Ardougne","link":"Tribal Totem","xp":{"Thieving":1775},"steps":[[1,"While in The Shrimp and Parrot to start the quest, purchase a tuna for Family Crest."],[1,"Travel to Ardougne via Captain Barnaby with 30 coins after starting the quest to complete an easy Karamja Diary task."]],"info":["Keep one swordfish from the quest reward for Family Crest."]},{"type":"row","id":"Sheep Herder","name":"Sheep Herder","qp":4,"loc":"Ardougne","link":"Sheep Herder","steps":[[1,"Take the lit candle from the Ardougne Monastery or your bank."],[1,"Purchase the following from Aemad's Adventuring Supplies:"],[2,"Knife to collect the boots of lightness"],[2,"12 balls of wool for Enlightened Journey,  Recipe for Disaster/Freeing Skrach Uglogwee, Prince Ali Rescue, Monkey Madness I, Regicide, Making History, and Mourning's End Part II's item list."],[2,"12 papyrus for The Golem, Enlightened Journey, Legends' Quest, and While Guthix Sleeps."],[2,"A water-filled vial pack. Vials of water are required for numerous quests, and can also be used to turn clay into soft clay. It will also be required to create a number of potions for future quests."],[2,"An iron axe for Mourning's End Part II's item list."],[1,"While near the sheep, take the knife and lit candle and head to the Temple of Ikov and enter it. Head directly west and descend the stairs. Slash the web at the other end of the room and pick up the boots."]],"info":["Good luck and do not lose your sanity!","This is a good time to collect your boots of lightness:"]},{"type":"row","id":"Partial completion of Dwarf Cannon","name":"Partially complete: Dwarf Cannon","qp":0,"loc":"Coal Trucks","link":"Dwarf Cannon","info":["Complete up until Captain Lawgof asks you to visit Nulodion at the dwarven base; the quest will be completed next time the guide takes you near the Dwarven Mine."]},{"type":"row","id":"Start Barcrawl","name":"Unlock: Barbarian Assault teleport / Partially complete: Alfred Grimhand's Barcrawl","qp":0,"loc":"Barbarian Outpost","link":"Barbarian Assault","steps":[[1,"Visit the Barbarian Outpost to complete the  Barbarian Assault tutorial for the minigame teleport."],[1,"Start Alfred Grimhand's Barcrawl by talking to the Barbarian guard by the gate to the east of the Barbarian Assault building. This miniquest involves visiting bars with the barcrawl card and buying alcohol from the bartender, and can be passively completed while doing other quests."],[1,"Visit The Flying Horse Inn in Ardougne and drink a Heart Stopper for Alfred Grimhand's Barcrawl."]]},{"type":"row","id":"Waterfall Quest","name":"Waterfall Quest","qp":1,"loc":"Baxtorian Falls","link":"Waterfall Quest","xp":{"Attack":13750,"Strength":13750},"steps":[[1,"After talking to Golrie near the Tree Gnome Village, use the spirit tree to visit the Blurberry Bar at the Grand Tree (also buy a Premade blurb' sp. for Death Plateau)"]],"info":["Hardcore ironmen may choose to complete Witch's House first for the additional Hitpoints levels to make this quest safer.","Keep the mithril seeds for Song of the Elves."]},{"type":"row","id":"Murder Mystery","name":"Murder Mystery","qp":3,"loc":"Sinclair Mansion","link":"Murder Mystery","xp":{"Crafting":1406},"steps":[[1,"While at the Poison Salesman step in the Forester's Arms, complete the Alfred Grimhand's Barcrawl step."]]},{"type":"row","id":"Partial completion of Merlin's Crystal","name":"Partially complete: Merlin's Crystal","qp":0,"loc":"Camelot","link":"Merlin's Crystal","steps":[[1,"While in Catherby, grab an extra bucket of wax for Troll Romance."],[1,"Complete the quest up until you need to visit the Lady of the Lake in Taverley. Complete this step while completing the following three quests."]]},{"type":"row","id":"Doric's Quest","name":"Doric's Quest","qp":1,"loc":"Taverley","link":"Doric's Quest","xp":{"Mining":1300},"steps":[[1,"Before starting this quest, mine 16 clay from the mine by the Champions' Guild. 6 are required for this quest, and the rest can be turned into soft clay using vials of water when required for future quests."],[1,"The Falador teleport tablet received from Daddy's Home may be used to get to the quest area. Bring the required items for this quest, Druidic Ritual and Witch's House (including combat gear) to quickly complete these three quests together. You can kill a black bear to the east of Doric on the hill for raw bear meat for Druidic Ritual."],[1,"Visit the Dwarven Mine to the east of Taverley to receive the ammo mould and Nulodion's notes from Nulodion for the Dwarf Cannon step."],[1,"Talk to the Lady of the Lake for the Merlin's Crystal step."]]},{"type":"row","id":"Druidic Ritual","name":"Druidic Ritual","qp":4,"loc":"Taverley","link":"Druidic Ritual","xp":{"Herblore":250},"info":["Grants access to the Herblore skill."]},{"type":"row","id":"Witch's House","name":"Witch's House","qp":4,"loc":"Taverley","link":"Witch's House","xp":{"Hitpoints":6325}},{"type":"row","id":"Dwarf Cannon","name":"Dwarf Cannon","qp":1,"loc":"Coal Trucks","link":"Dwarf Cannon","xp":{"Crafting":750},"info":["You should be at the step to bring the ammo mould and Nulodion's notes to Captain Lawgof to complete the quest.","Completion of this quest allows the use of the dwarf multicannon and smithing of cannonballs."]},{"type":"row","id":"Merlin's Crystal","name":"Merlin's Crystal","qp":6,"loc":"Camelot","link":"Merlin's Crystal","steps":[[1,"While in Port Sarim visit The Rusty Anchor for Alfred Grimhand's Barcrawl."]]},{"type":"row","id":"Holy Grail","name":"Holy Grail","qp":2,"loc":"Camelot","link":"Holy Grail","xp":{"Defence":15300,"Prayer":11000},"steps":[[1,"For the Entrana step:"],[2,"Purchase 11 buckets of sand from Trader Stan's Trading Post on the southernmost dock in Port Sarim."],[2,"Either purchase 11 seaweed from the same shop, or pick up 11 pieces of seaweed in the north-western corner of Entrana."],[2,"Pick up the glassblowing pipe from  Fritz the Glassblower's house on Entrana."],[2,"Use all of the seaweed on the cooking range to create soda ash."],[2,"Use all of the soda ash on the furnace to the east to create molten glass."],[2,"Use the glassblowing pipe on one piece of glass to create a candle lantern, a light source to be used in future quests that take you to the Lumbridge Swamp Caves. You can light it with the black candle you got from Merlin's Crystal. Save the remaining molten glass for use in the Observatory Quest, Horror from the Deep, Wanted!, Desert Treasure I and The Fremennik Exiles."],[1,"Bring a spade with you to Galahad. After talking to him, enter McGrubor's Wood to dig up 3 red vine worms for Fishing Contest, Fairytale I - Growing Pains and Wanted!."],[1,"When travelling to Draynor Manor:"],[2,"Take your garlic, stake, and hammer to the basement of the manor to kill Count Draynor and complete Vampyre Slayer."],[1,"When travelling to Karamja for the Fisher Realm step:"],[2,"Travel from Port Sarim to Musa Point."],[2,"Visit the Karamja Spirits Bar for Alfred Grimhand's Barcrawl."],[2,"On the way to Brimhaven, enter the Karamja Dungeon and then enter the Fight Caves for an easy Karamja Diary step."],[2,"Continue onwards to Brimhaven and visit the Dead Man's Chest for Alfred Grimhand's Barcrawl."],[2,"Travel to Ardougne and back at the port for another easy Karamja Diary step."],[2,"While heading to the gold mine to get to the Fisher Realm, use the rope swing to travel to the western island and back for another easy Karamja Diary step."]],"info":["The Black Knight Titan has very good Ranged and Magic defence, so attack with a melee weapon and quickly move away from the Titan and you will not be hit."]},{"type":"row","id":"Vampyre Slayer","name":"Vampyre Slayer","qp":3,"loc":"Draynor Village","link":"Vampyre Slayer","xp":{"Attack":4825},"info":["Complete during Holy Grail."]},{"type":"row","id":"Below Ice Mountain","name":"Below Ice Mountain","qp":1,"loc":"Asgarnia","link":"Below Ice Mountain","steps":[[1,"While in Falador, start Black Knights' Fortress by talking to Sir Amik Varze on the 2nd floor (UK) of the White Knights' Castle's western tower."],[1,"While in the Rising Sun Inn in Falador complete the Alfred Grimhand's Barcrawl step."],[1,"Get a haircut from the Falador hairdresser next door for an easy Falador Diary task."],[1,"Take a bucket and fill it with water from the pump by the hairdressers for another easy Falador Diary task."],[1,"While in the Blue Moon Inn in Varrock complete the Alfred Grimhand's Barcrawl step."],[1,"Pick a cabbage south of the inn and purchase an iron chainbody from Horvik's Armour Shop for Black Knights' Fortress."],[1,"While in Barbarian Village, bring two soft clay to use on the potter's wheel to create two unfired bowls. One is required for Dragon Slayer I; use the other one on the pottery oven for an easy Varrock Diary task."],[1,"Purchase a bronze med helm from the Barbarian Village Helmet Shop for Black Knights' Fortress. Purchase a second for Mourning's End Part II's item list."],[1,"On your way back to Ice Mountain for the final step, bring food and go to the Black Knights' Fortress and complete that section of the Black Knights' Fortress quest."],[1,"After completing Below Ice Mountain, return to Sir Amik Varze to complete Black Knights' Fortress."]],"info":["Black Knights' Fortress can be completed during this quest."]},{"type":"row","id":"Black Knights' Fortress","name":"Black Knights' Fortress","qp":3,"loc":"Falador","link":"Black Knights' Fortress","info":["Complete during Below Ice Mountain."]},{"type":"row","id":"Pirate's Treasure","name":"Pirate's Treasure","qp":2,"loc":"Falador","link":"Pirate's Treasure","steps":[[1,"You should be at the final step to complete the quest in Falador Park."],[1,"While there, kill a duck with a ranged weapon or magic for an easy Falador diary task."]],"info":["Keep the gold ring for Mourning's End Part II's item list, and the emerald for Legends' Quest."]},{"type":"row","id":"A Ruff Situation","name":"A Ruff Situation","qp":1,"loc":"Varrock","link":"A Ruff Situation","xp":{"Crafting":1000},"info":["Allows raising of puppies."]},{"type":"row","id":"The Ides of Milk","name":"The Ides of Milk","qp":1,"loc":"Lumbridge","link":"The Ides of Milk","xp":{"Prayer":1000},"info":["After finishing the quest, talk to Gillie Groats again to receive extra rewards. Use the magic lamp on Prayer."]},{"type":"row","id":"Observatory Quest","name":"Observatory Quest","qp":2,"loc":"Observatory","link":"Observatory Quest","xp":{"Crafting":2000},"steps":[[1,"Visit the Dragon Inn in Yanille for Alfred Grimhand's Barcrawl. While there, buy a greenman's ale, then pick up 2 rotten tomatoes from Pelters' Veg Stall for Recipe for Disaster/Another Cook's Quest and Mourning's End Part II's item list."],[1,"Purchase 8 pots at Frenita's Cookery Shop for Rag and Bone Man I."],[1,"Pick up the superantipoison (1) every time you walk past it (so that you have about a full vial); it will be very useful for Scorpion Catcher."],[1,"After completion of this quest, use a silver bar at a furnace in Ardougne to craft a silver sickle for Nature Spirit."]],"info":["This quest has 12 variations of random rewards, which may include 875 experience in either Attack, Strength, or Defence. Note: If you are level 1 in a specific combat style, you will not be assigned a constellation that gives experience in that combat skill."]},{"type":"row","id":"Priest in Peril","name":"Priest in Peril","qp":1,"loc":"Paterdomus","link":"Priest in Peril","xp":{"Prayer":3906},"steps":[[1,"On your way to the Paterdomus Temple:"],[2,"Visit the Jolly Boar Inn west of the Lumber yard for Alfred Grimhand's Barcrawl."],[2,"Talk to the Odd Old Man at the mine west of the temple to start Rag and Bone Man I."]],"info":["Allows access to Morytania.","After completion of this quest, use the antique lamp you have been holding since completing the easy Ardougne diary on Prayer."]},{"type":"row","id":"Partially complete Rag and Bone Man I","name":"Partially complete: Rag and Bone Man I","qp":0,"loc":"Paterdomus","link":"Rag and Bone Man I","info":["Start during Priest in Peril, but collect the bones during the following quests when recommended by the guide."]},{"type":"row","id":"Nature Spirit","name":"Nature Spirit","qp":2,"loc":"Paterdomus","link":"Nature Spirit","xp":{"Crafting":3000,"Defence":2000,"Hitpoints":2000},"steps":[[1,"Before visiting the Nature Grotto, stop at Canifis:"],[2,"Bank all of the pies given by Drezel. The pie dishes will be used for future quests."],[2,"Purchase 20-30 raw trout from Rufus' Meat Emporium for Death Plateau (10 cooked trout are needed, 54% chance to burn at Cooking)."],[2,"Purchase a bag of salt from Mazchna for Icthlarin's Little Helper."],[1,"After completion of this quest, restore your prayer points at the altar of nature in the Nature Grotto to complete an easy Morytania Diary task."]],"info":["You will need a ghostspeak amulet and a silver sickle."]},{"type":"row","id":"Recruitment Drive","name":"Recruitment Drive","qp":1,"loc":"Falador","link":"Recruitment Drive","xp":{"Agility":1000,"Herblore":1000,"Prayer":1000},"info":["Requires an empty inventory."]},{"type":"row","id":"Alfred Grimhand's Barcrawl","name":"Alfred Grimhand's Barcrawl (miniquest)","qp":0,"loc":"Barbarian Outpost","link":"Alfred Grimhand's Barcrawl","info":["You should now have visited all of the required bars. Return to the Barbarian Guard at the gate to the east of the Barbarian Assault building with the barcrawl card to complete the miniquest.","Allows use of the Barbarian Outpost Agility Course, which is required for Scorpion Catcher and Horror from the Deep."]},{"type":"row","id":"Anti-dragon shield","name":"Unlock: Anti-dragon shield","qp":0,"loc":"Champions' Guild","link":"Anti-dragon shield","steps":[[1,"Start the quest by speaking to the Guildmaster at the Champions' Guild south of Varrock. You may also jump over the fence to the south-east to complete an easy Varrock Diary task."],[1,"Talk to Oziach in Edgeville."],[1,"Return to the Guildmaster and ask him all the questions."],[1,"Talk to Duke Horacio on the 1st floor (UK) of Lumbridge Castle to receive the shield."]],"info":["Before starting Scorpion Catcher, partial completion of Dragon Slayer I will unlock the Anti-dragon shield to make this quest safer by protecting you from dragonfire in the Taverley Dungeon step.","To collect the shield:"]},{"type":"row","id":"Scorpion Catcher","name":"Scorpion Catcher","qp":1,"loc":"Seers' Village","link":"Scorpion Catcher","xp":{"Strength":6625},"steps":[[1,"While at the Sorcerer's Tower complete the following Rag and Bone Man I tasks:"],[2,"At the sheep pen south-west of the tower, kill a ram and pick up the ram skull."],[2,"At the mine south of the tower, kill a grizzly bear and pick up the bear ribs. Also pick up the bear fur for Mourning's End Part I."],[2,"By Keep Le Faye east of the tower, kill a giant bat and pick up the giant bat wing."],[1,"On your way to the Taverley Dungeon, cross the crumbling wall in western Falador for an easy Falador Diary task."]]},{"type":"row","id":"Jungle Potion","name":"Jungle Potion","qp":1,"loc":"Tai Bwo Wannai","link":"Jungle Potion","xp":{"Herblore":775},"steps":[[1,"Optional: Bring a small fishing net to catch stackable raw karambwanji for your kitten. You will need to train to 5 Fishing beforehand."],[1,"(First herb) Collect two extra grimy snake weed, one for Zogre Flesh Eaters and another for Legends' Quest."],[1,"(Second herb) Collect one extra ardrigal for Legends' Quest."],[1,"(Fourth herb) Collect an extra grimy volencia moss for Fairytale I."],[1,"Kill a nearby monkey and pick up the monkey paw for Rag and Bone Man I."],[1,"(Fifth herb) Collect an extra grimy rogue's purse for Zogre Flesh Eaters."],[1,"After completion of this quest:"],[2,"Purchase 15 breads from Jiminua's Jungle Store south of Brimhaven for Death Plateau, Enakhra's Lament, and two Recipe for Disaster subquests."],[2,"Collect five seaweed from the west coast for an easy Karamja Diary task."]]},{"type":"row","id":"A Porcine of Interest","name":"A Porcine of Interest","qp":1,"loc":"Draynor Village","link":"A Porcine of Interest","xp":{"Slayer":1000},"steps":[[1,"While talking to Sarah, buy 10 empty sacks for Enlightened Journey and Mourning's End Part II's item list."],[1,"Pick 20 potatoes from the potato field to the east of Draynor Village and fill 2 sacks with them for Enlightened Journey and Mourning's End Part II's item list."],[1,"After completion of this quest in Draynor Village, perform the following Rag and Bone Man I tasks:"],[2,"Buy 8 jugs of vinegar from the Wine Shop and use them on your 8 pots to create pots of vinegar for Rag and Bone Man I."],[2,"Kill a level 2 goblin south of the village and pick up the goblin skull."],[2,"Kill a unicorn in the swamp and pick up the unicorn bone. Keep the unicorn horn for Ratcatchers."],[2,"Kill a giant rat in the swamp and pick up the giant rat bone."],[2,"Kill a big frog in the swamp and pick up the big frog leg."],[1,"While in the swamp, collect 6 swamp tar for Cold War, Eagles' Peak, Forgettable Tale..., Horror from the Deep, Tears of Guthix and Troll Romance."]]},{"type":"row","id":"Rag and Bone Man I","name":"Rag and Bone Man I","qp":1,"loc":"Paterdomus","link":"Rag and Bone Man I","xp":{"Prayer":500,"Cooking":500},"info":["You should now have all of the bones required to complete the quest.","After completion of this quest start Rag and Bone Man II."]},{"type":"row","id":"Partially complete Rag and Bone Man II","name":"Partially complete: Rag and Bone Man II","qp":0,"loc":"Paterdomus","link":"Rag and Bone Man II","info":["Start immediately after Rag and Bone Man I and pick up the bones during future quests. Note that completion of this quest will take a very long time, and you will not immediately have the requirements to collect every bone, with the highest requirement being 40 Slayer.","You can begin by killing bats near the Odd Old Man until you obtain a bat wing."]},{"type":"train","skill":"Cooking","lvl":15},{"type":"row","id":"Death Plateau","name":"Death Plateau","qp":1,"loc":"Burthorpe","link":"Death Plateau","xp":{"Attack":3000},"info":["Level 15 Cooking is required to cook the trout needed for this quest.","You'll also need an iron bar, which you cannot smith yet. There is an iron bar spawn north-west of the Ferox Enclave accessible via a Clan Wars minigame teleport, and one at the Sunset Coast south of Civitas illa Fortis. They are also a drop from Paladins in Ardougne (safespottable) at a rate of 1/14.22 or from the White Knights in Falador at a rate of 1/16. Pick up two additional bars for The Knight's Sword."]},{"type":"row","id":"The Queen of Thieves","name":"The Queen of Thieves","qp":1,"loc":"Port Piscarilius","link":"The Queen of Thieves","xp":{"Thieving":2000},"steps":[[1,"Kill seagulls on the southern docks until they drop a seagull wing for Rag and Bone Man II."],[1,"While in The Warrens, trade the shopkeeper in the Warrens General Store to complete an easy Kourend & Kebos Diary task."],[1,"After the Conrad King step, from Frankie's Fishing Emporium purchase three raw cod for Freeing Pirate Pete, a raw shark for The Fremennik Trials and a raw swordfish for the Ardougne medium diary Swordchick."]],"info":["A stew is required, which was received as a quest reward from Gertrude's Cat or can be bought from Forester's Arms in Seers' Village for 20 coins."]},{"type":"row","id":"The Forsaken Tower","name":"The Forsaken Tower","qp":1,"loc":"Great Kourend","link":"The Forsaken Tower","xp":{"Mining":500,"Smithing":500}},{"type":"train","skill":"Agility","lvl":18},{"type":"row","id":"The Depths of Despair","name":"The Depths of Despair","qp":1,"loc":"Hosidius","link":"The Depths of Despair","xp":{"Agility":1500},"steps":[[1,"Bring a spade to mine some Saltpetre for an easy Kourend & Kebos Diary task on your way to the cave."],[1,"Kill a sand crab whilst in the crab claw caves for an easy Kourend & Kebos Diary task."],[1,"Steal a fruit from the Fruit Stall to the north for an easy Kourend & Kebos Diary task after completing the quest."]]},{"type":"row","id":"Tale of the Righteous","name":"Tale of the Righteous","qp":1,"loc":"Great Kourend","link":"Tale of the Righteous"},{"type":"train","skill":"Agility","lvl":25},{"type":"row","id":"The Grand Tree","name":"The Grand Tree","qp":5,"loc":"Tree Gnome Stronghold","link":"The Grand Tree","xp":{"Attack":18400,"Agility":7900,"Magic":2150},"steps":[[1,"Before starting the quest, kill terrorbirds to the south-west of the Grand Tree until they drop a terrorbird wing for Rag and Bone Man II."],[1,"While in the Grand Tree, buy a gnome spice and an orange for Recipe for Disaster/Freeing the Goblin generals at the Grand Tree Groceries. Buy 3 vodkas from Heckel Funch on the east side of the 1st floor (UK) (east of the pub): 2 for Bone Voyage and 1 for Eadgar's Ruse."],[1,"When on Karamja, kill Jogres by the Gnome glider west of the Ship Yard until you obtain a Jogre bone for Rag and Bone Man II. Keep the Jogre Bones for Tai Bwo Wannai Trio."],[1,"After completion of this quest, start Making History by talking to Jorral at The Outpost south-west of the Tree Gnome Stronghold."]],"info":["Allows use of the gnome glider transportation system."]},{"type":"row","id":"Mountain Daughter","name":"Mountain Daughter","qp":2,"loc":"Rellekka","link":"Mountain Daughter","xp":{"Attack":1000,"Prayer":2000},"steps":[[1,"Use the minigame teleport to Barbarian Assault. Take out two planks, 60 steel nails, a hammer and some food and cross the basalt rock to the north."],[1,"Start Horror from the Deep by talking to Larrissa outside the Lighthouse."],[1,"Head east and use two planks to fix the bridge for Horror from the Deep."],[1,"Stop at Rellekka to complete that section of Making History."],[1,"Head east past Rellekka, and kill bunnies by the swaying tree until you obtain a rabbit bone."],[1,"Start The Giant Dwarf in the cave north-west of the camp to unlock the trapdoor shortcut from Grand Exchange and Blast Furnace minigame teleport. Completing the cutscene and conversation with Commander Veldaban unlocks it."],[1,"While in Keldagrim, buy the following from Gunslik's Assorted Items:"],[2,"Charcoal for The Dig Site (you may consider purchasing 4 more for future quests)."],[2,"Pestle and mortar if you don't have one for The Dig Site."],[2,"4 vials for The Dig Site, The Golem, The Hand in the Sand and Land of the Goblins."],[2,"2 ropes for The Dig Site."],[2,"Chisel for The Golem."],[1,"Retrieve the quest items and combat gear, then leave the area by talking to the Dwarven Boatman north-east of the river. You can now head to the quest area."]],"info":["Before starting the quest:"]},{"type":"row","id":"Shield of Arrav","name":"Shield of Arrav","qp":1,"loc":"Varrock","link":"Shield of Arrav","info":["The chat channel for finding a partner is 'osrs soa'."]},{"type":"row","id":"The Dig Site","name":"The Dig Site","qp":2,"loc":"Varrock","link":"The Dig Site","xp":{"Herblore":2000,"Mining":15300},"steps":[[1,"Before beginning this quest, start The Golem in the Ruins of Uzer and complete that section of the quest."],[1,"Both quests will require you to visit the Digsite and then the Varrock Museum, so complete those two steps together."],[1,"On your way to the digsite, take a pickaxe and mine an iron ore from the South-east Varrock mine for an easy Varrock Diary task."],[1,"After completion of this quest, return the level 3 certificate to Curator Haig Halen at the Varrock Museum for a fruit blast which can be used in Recipe for Disaster: Another Cook's Quest."]]},{"type":"row","id":"The Golem","name":"The Golem","qp":1,"loc":"Ruins of Uzer","link":"The Golem","xp":{"Crafting":1000,"Thieving":1000},"steps":[[1,"You should be at the final step of this quest to return to the Ruins of Uzer. On the way, visit the Al Kharid mine and mine 12 coal for Elemental Workshop I and Elemental Workshop II, and 1 iron ore for an easy Lumbridge & Draynor Diary task."],[1,"Start Prince Ali Rescue while passing through Al Kharid by talking to  Chancellor Hassan, then Osman."],[1,"Bring a bird snare, pickaxe, hammer, chisel and knife. While in the Shantay Pass, purchase a full set of desert clothing and an empty waterskin. Equip it when passing through the pass to for an easy Desert Diary task."],[1,"On the way to Uzer use your knife on a Kharidian cactus for an easy Desert Diary task."],[1,"When stealing the feather from the Desert phoenix, mine five clay nearby for another easy Desert Diary task."],[1,"Use the bird snare to catch a nearby golden warbler for another easy Desert Diary task."],[1,"Use the hammer and chisel to collect two sapphires, two rubies and two emeralds from the throne in the throne room. One sapphire is required for Tears of Guthix and Making History respectively."]]},{"type":"row","id":"Ethically Acquired Antiquities","name":"Ethically Acquired Antiquities","qp":1,"loc":"Varlamore","link":"Ethically Acquired Antiquities","xp":{"Thieving":6000},"info":["Travel to Varlamore for this quest via Regulus Cento at Varrock's eastern entrance. While in Civitas illa Fortis buy an iron spear from the Fortis Blacksmith for Tai Bwo Wannai Trio."]},{"type":"row","id":"Twilight's Promise","name":"Twilight's Promise","qp":1,"loc":"Varlamore","link":"Twilight's Promise","xp":{"Thieving":3000},"steps":[[1,"After the quest, use the Quetzal Transport System to travel to Tal Teklan. At the Dyes to Die For shop purchase the following dyes for future quests. Consider buying a few extra dyes of each colour for safety. The purchase list assumes blue dye is used for Freeing the Goblin generals and 3x yellow/red/blue are used for Ghosts Ahoy."],[2,"7 blue dyes"],[2,"2 orange dyes"],[2,"8 yellow dyes"],[2,"8 red dyes"],[2,"1 green dye"],[2,"2 purple dyes"],[1,"Purchase an oak longbow from Arcuani's Archery Supplies for Ghosts Ahoy."]]},{"type":"train","skill":"Thieving","lvl":34},{"type":"train","skill":"Agility","lvl":32},{"type":"row","id":"Death on the Isle","name":"Death on the Isle","qp":2,"loc":"Aldarin","link":"Death on the Isle","xp":{"Agility":7500,"Thieving":10000,"Crafting":5000},"info":["After the quest, make sure to claim your costume needle, which doesn't require thread to craft, from the costumer down in the cellar out back."]},{"type":"row","id":"Recipe for Disaster/Another Cook's Quest","name":"Recipe for Disaster/Another Cook's Quest","qp":1,"loc":"Lumbridge","link":"Recipe for Disaster/Another Cook's Quest"},{"type":"row","id":"Goblin Diplomacy","name":"Goblin Diplomacy","qp":5,"loc":"Goblin Village","link":"Goblin Diplomacy","xp":{"Crafting":200}},{"type":"row","id":"The Lost Tribe","name":"The Lost Tribe","qp":1,"loc":"Lumbridge","link":"The Lost Tribe","xp":{"Mining":3000},"steps":[[1,"After completion of this quest, talk to Mistag to start Death to the Dorgeshuun."],[1,"Kill cave goblins until they drop a cave goblin skull for Rag and Bone Man II."]],"info":["Allows access to Nardok's Bone Weapons where players can purchase the Dorgeshuun crossbow and bone bolts for early Ranged training.","Keep the ring of life quest reward for The Curse of Arrav if you do not plan to obtain more."]},{"type":"row","id":"Death to the Dorgeshuun","name":"Death to the Dorgeshuun","qp":1,"loc":"Lumbridge Swamp Caves","link":"Death to the Dorgeshuun","xp":{"Ranged":2000,"Thieving":2000},"steps":[[1,"After completion of this quest:"],[2,"Enter Dorgesh-Kaan south of Mistag."],[2,"At Miltog's Lamps in the central part of the Dorgesh-Kaan marketplace, purchase a bullseye lantern (empty)."],[2,"Use swamp tar on the nearby lamp still to fill it and use the empty lantern on the still to fill it with oil."],[2,"Use a sapphire on the bullseye lantern to create a sapphire lantern."]],"info":["Make sure to keep a set of polished buttons from H.A.M. members for Animal Magnetism later.","Kill a Cave bug during the quest while travelling underground for an easy Lumbridge & Draynor Diary task.","The sapphire lantern is required to complete Tears of Guthix. Consider completing this quest earlier if you have 49 Firemaking as it unlocks a useful weekly minigame for gathering experience in your lowest skill."]},{"type":"row","id":"Recipe for Disaster/Freeing the Goblin generals","name":"Recipe for Disaster/Freeing the Goblin generals","qp":1,"loc":"Goblin Village","link":"Recipe for Disaster/Freeing the Goblin generals","xp":{"Cooking":1000,"Crafting":1000,"Farming":1000},"steps":[[1,"Completing this quest unlocks access to the second tier of the Culinaromancer's Chest. Purchase the following from it (hop worlds to refresh stock):"],[2,"7 buckets of milk for Ghosts Ahoy, A Tail of Two Cats, Ratcatchers, Recipe for Disaster (three subquests), and Mourning's End Part II's item list."],[2,"7 pots of flour for Prince Ali Rescue, Recipe for Disaster (two subquests), The Knight's Sword, The Giant Dwarf, Prying Times, and Mourning's End Part II's item list."],[2,"3 eggs for Recipe for Disaster (two subquests) and Mourning's End Part II's item list."],[2,"3 cake tins for Recipe for Disaster (one subquest), Troll Romance and Mourning's End Part II's item list."],[2,"Grapes for Monkey Madness II."],[2,"Pot of cream for Recipe for Disaster (one subquest)."],[2,"Spice for Desert Treasure I."],[1,"Create 3 redberry pies for The Knight's Sword, The Giant Dwarf and Prying Times while in the cellar:"],[2,"Use a pot of flour on a bucket of water (a bucket spawns in the cellar and can be filled at the nearby sink) to create pastry dough."],[2,"Use the pastry dough on a pie dish to create a pie shell."],[2,"Use redberries on the pie shell to create an uncooked berry pie."],[2,"Cook the uncooked berry pie on the kitchen range. If you fail to cook it, repeat the steps (purchase more flour as necessary). The burnt pie can be emptied to reclaim the pie dish. If you run out of redberries, you can purchase more from the Port Sarim Food Store and cook the pie nearby."]],"info":["Use blue dye on the orange slices."]},{"type":"row","id":"The Knight's Sword","name":"The Knight's Sword","qp":1,"loc":"Falador","link":"The Knight's Sword","xp":{"Smithing":12725},"steps":[[1,"On the way to Thurgo, mine 16 iron ore at the Rimmington Mine for future quests to be used in iron bars. Note that you won't have the required Smithing level for the two iron bars required for this quest - you can obtain those from spawns if you haven't already."],[1,"Mine an extra blurite ore for the easy Falador Diary."]],"info":["Completion of this quest grants you the Smithing level required to smith iron bars. Smelt both the iron ore and the blurite ore you have gathered at the Falador furnace."]},{"type":"row","id":"Prince Ali Rescue","name":"Prince Ali Rescue","qp":3,"loc":"Al Kharid","link":"Prince Ali Rescue","steps":[[1,"Speak to Osman after completing the quest and ask him if there is anything you can help with to unlock the Sorceress's Garden Minigame Teleport."]]},{"type":"row","id":"The Feud","name":"The Feud","qp":1,"loc":"Al Kharid","link":"The Feud","xp":{"Thieving":15000},"steps":[[1,"While in Pollnivneach, collect 3 buckets of Ugthanki dung for My Arm's Big Adventure, and 1 extra bucket for Forgettable Tale... before you return to Al Kharid to complete The Feud."]]},{"type":"train","skill":"Woodcutting","lvl":30},{"type":"train","skill":"Firemaking","lvl":30},{"type":"row","id":"Icthlarin's Little Helper","name":"Icthlarin's Little Helper","qp":2,"loc":"Sophanem","link":"Icthlarin's Little Helper","xp":{"Agility":4000,"Thieving":4500,"Woodcutting":4000},"info":["Train to 30 Woodcutting for the willow log required for this quest, and obtain a second one for Enakhra's Lament. When obtaining a bucket of sap, get a second one for The Eyes of Glouphrie.","It is possible to obtain an agility potion(4) from the Possessed Priest at the end of the quest, which may be saved for use in Tai Bwo Wannai Trio."]},{"type":"row","id":"Shadow of the Storm","name":"Shadow of the Storm","qp":1,"loc":"Al Kharid","link":"Shadow of the Storm","xp":{"Ranged":10000},"info":["Flinch the quest boss with melee to avoid taking damage.","For the black clothing required in the quest, you should have the black wizard hat and priest gown set.","Use the experience reward on Ranged."]},{"type":"row","id":"Sea Slug","name":"Sea Slug","qp":1,"loc":"Witchaven","link":"Sea Slug","xp":{"Fishing":7175},"info":["Complete a medium task for the Ardougne diary by fishing on the platform. You can buy a small fishing net from a shop near the quest start in Witchaven."]},{"type":"row","id":"Fishing Contest","name":"Fishing Contest","qp":1,"loc":"Hemenster","link":"Fishing Contest","xp":{"Fishing":2437}},{"type":"row","id":"Recipe for Disaster/Freeing the Mountain Dwarf","name":"Recipe for Disaster/Freeing the Mountain Dwarf","qp":1,"loc":"Falador","link":"Recipe for Disaster/Freeing the Mountain Dwarf","xp":{"Cooking":1000,"Slayer":1000},"info":["When talking to Kaylee in the Falador pub, purchase a Wizard's mind bomb for Dragon Slayer I."]},{"type":"row","id":"The Ribbiting Tale of a Lily Pad Labour Dispute","name":"The Ribbiting Tale of a Lily Pad Labour Dispute","qp":1,"loc":"Varlamore","link":"The Ribbiting Tale of a Lily Pad Labour Dispute","xp":{"Woodcutting":2000}},{"type":"train","skill":"Woodcutting","lvl":36},{"type":"row","id":"Lost City","name":"Lost City","qp":3,"loc":"Lumbridge Swamp","link":"Lost City","steps":[[1,"Cut a second dramen branch for Recipe for Disaster/Freeing Sir Amik Varze, and optionally a third one to make a step in The Fremennik Trials easier. Do not turn them into dramen staffs."]],"info":["You may get a zombie bone while trying to get a bronze axe from the zombies.","Grants the ability to make cosmic runes and to use the dragon dagger and the dragon longsword."]},{"type":"row","id":"Fairytale I - Growing Pains","name":"Fairytale I - Growing Pains","qp":2,"loc":"Draynor Village","link":"Fairytale I - Growing Pains","xp":{"Attack":2000,"Farming":3500,"Magic":1000},"info":["There is a small chance you may need either Fishing or Fishing to obtain a raw slimy eel or raw cave eel, respectively."]},{"type":"row","id":"Partial completion of Fairytale II - Cure a Queen","name":"Partially complete: Fairytale II - Cure a Queen","qp":0,"loc":"Draynor Village","link":"Fairytale II - Cure a Queen","info":["Continue with this quest until you unlock fairy rings."]},{"type":"row","id":"Ratcatchers","name":"Ratcatchers","qp":2,"loc":"Varrock","link":"Ratcatchers","xp":{"Thieving":4500},"steps":[[1,"Kill rats until you obtain a rat bone."],[1,"Kill zombies until you obtain a zombie bone."]],"info":["The rat poison required for this quest can be obtained from the Clock Tower dungeon if you didn't pick up an extra one during Clock Tower. Making it yourself is not required to complete the quest.","When in the Varrock Sewers, complete the following Rag and Bone Man II tasks:","After completing this quest you can start growing your adult cat into a wily cat, which is the best cat for catching hellrats."]},{"type":"row","id":"Recipe for Disaster/Freeing Evil Dave","name":"Recipe for Disaster/Freeing Evil Dave","qp":1,"loc":"Edgeville","link":"Recipe for Disaster/Freeing Evil Dave","xp":{"Cooking":7000},"info":["Gain access to spicy stews during the quest, which can be useful for boosting stats. The 9 required stews can be obtained from The Cloak and Stagger in Shayzien. Ensure you have raised a kitten into a cat first before completing this quest and the following quest Ratcatchers."]},{"type":"row","id":"Ghosts Ahoy","name":"Ghosts Ahoy","qp":2,"loc":"Port Phasmatys","link":"Ghosts Ahoy","xp":{"Prayer":2400},"steps":[[1,"When gathering the ecto-tokens, get an additional 20 for Animal Magnetism."],[1,"Make an additional Nettle tea for Skippy and the Mogres."],[1,"While in Port Phasmatys, create a sapphire amulet by using a gold bar on the nearby furnace while also carrying a cut sapphire and an amulet mould, then string it with a ball of wool."],[1,"Talk to Droalak for Making History, then give the sapphire amulet to Melina east of the general store. Return to Drolak to receive a scroll."]],"info":["This quest unlocks the ectophial for an unlimited teleport to the Ectofuntus, and gives free access to Port Phasmatys."]},{"type":"row","id":"Creature of Fenkenstrain","name":"Creature of Fenkenstrain","qp":2,"loc":"Canifis","link":"Creature of Fenkenstrain","xp":{"Thieving":1000},"steps":[[1,"Before beginning the quest, create 7 bronze wire on an anvil. 3 will be used for this quest, and the remaining 4 are for Recipe for Disaster/Freeing Pirate Pete and Shilo Village."],[1,"While in the experiment cave, kill experiments until you obtain an experiment bone for Rag and Bone Man II."]]},{"type":"row","id":"Shades of Mort'ton","name":"Shades of Mort'ton","qp":3,"loc":"Mort'ton","link":"Shades of Mort'ton","xp":{"Crafting":2000,"Herblore":2000},"steps":[[1,"It is recommended to make several doses of serum 208 to use on Razmire Keelgan to gain access to the building supplies store, or on the afflicted villagers to receive drops. (See \"Cure rewards\" under Serum 208.)"],[1,"Once done, purchase 11 swamp paste from the Mort'ton Builder's Store for The Slug Menace, Dragon Slayer II, and Mourning's End Part II's item list."],[1,"After the quest bring the diary of Herbi Flax to the Apothecary in Varrock for 335 Herblore experience."]]},{"type":"row","id":"Making History","name":"Making History","qp":3,"loc":"Outpost","link":"Making History","xp":{"Crafting":1000,"Prayer":1000},"info":["You should have completed the Rellekka and Port Phasmatys steps of this quest. Complete the silver merchant step and then finish the quest by returning to Jorral with the journal and scroll."]},{"type":"train","skill":"Prayer","lvl":37},{"type":"row","id":"Temple of Ikov","name":"Temple of Ikov","qp":1,"loc":"Ardougne","link":"Temple of Ikov","xp":{"Fletching":8000,"Ranged":10500},"steps":[[1,"Equip the ice arrows obtained during the quest alongside darts or throwing knives to avoid needing a yew shortbow. Both black knives and black darts are a common drop from Burthorpe soldiers. Alternatively to killing soldiers, you can purchase steel knives from Martin Thwait's Lost and Found. if you have 50 Agility and Thieving. Pray Protect from Magic when fighting the Fire Warrior of Lesarkus."],[1,"The 20 required limpwurt roots can be obtained as drops from hobgoblins or hill giants."],[1,"Side with the Guardians of Armadyl for the Armadyl pendant for cheap God Wars Dungeon protection."]]},{"type":"row","id":"Varrock Museum","name":"Unlock: Varrock Museum Kudos","qp":0,"loc":"Varrock","link":"Varrock Museum","xp":{"Herblore":3000,"Mining":3500,"Crafting":2500},"steps":[[1,"Talk to Historian Minas just up the stairs and tell him the information about the displays to get the kudos and three antique lamp from the quests you have done. Use them on Herblore."],[1,"Complete the cleaning finds part of the Varrock Museum to earn another 50 kudos. Combining these 50 kudos, the 28 kudos from the Natural History Quiz, and the 50 kudos from Historian Minas, this should put you at 128 kudos in total."],[1,"Finally, talk to the information clerk to claim Mining and Crafting experience."]]},{"type":"row","id":"Bone Voyage","name":"Bone Voyage","qp":1,"loc":"Varrock","link":"Bone Voyage","info":["This quest requires you to earn 100 kudos from the Varrock museum, which you should have from the last step.","Group ironmen with a party member with at least level 25 Construction (boostable) can now start doing birdhouse runs. Other ironmen can get level 23 Construction now to start doing the runs (boost with tea), or wait for The Fremennik Isles.","Marrentill can be dropped by chaos druids in Taverley Dungeon."]},{"type":"row","id":"The Tourist Trap","name":"The Tourist Trap","qp":2,"loc":"Kharidian Desert","link":"The Tourist Trap","xp":{"Agility":9300},"info":["Choose Agility for both experience rewards.","The boss can be safespotted by talking to a guard and using said guard as an object to hide behind."]},{"type":"row","id":"Wanted!","name":"Wanted!","qp":1,"loc":"Falador","link":"Wanted!","xp":{"Slayer":5000},"steps":[[1,"While in the Taverley Dungeon, kill Baby blue dragons until you obtain a Baby dragon bone for Rag and Bone Man II. Keep 1 Babydragon bones for Mourning's End Part II's item list."]]},{"type":"row","id":"Ernest the Chicken","name":"Ernest the Chicken","qp":4,"loc":"Draynor Manor","link":"Ernest the Chicken","info":["Prepare quest items for Animal Magnetism as well before heading to Draynor Manor."]},{"type":"row","id":"Animal Magnetism","name":"Animal Magnetism","qp":1,"loc":"Draynor Manor","link":"Animal Magnetism","xp":{"Crafting":1000,"Fletching":1000,"Slayer":1000,"Woodcutting":2500},"steps":[[1,"While in Alice's cow pen, kill undead cows until you obtain undead cow ribs for Rag and Bone Man II."]],"info":["A Holy Symbol can be blessed by the monk in the monastery near Edgeville.","A mithril axe can be bought from  Lunami's Axe Shop in Auburnvale."]},{"type":"row","id":"Imp Catcher","name":"Imp Catcher","qp":1,"loc":"Wizards' Tower","link":"Imp Catcher","xp":{"Magic":875},"info":["Camp the spawns of imps on the east side of the Ardougne Monastery or in a basement in Kastori for beads.","They also drop mind talismans which you should keep for the easy Falador Diary."]},{"type":"train","skill":"Magic","lvl":33},{"type":"row","id":"The Giant Dwarf","name":"The Giant Dwarf","qp":2,"loc":"Keldagrim","link":"The Giant Dwarf","xp":{"Crafting":2500,"Firemaking":1500,"Mining":2500,"Smithing":2500,"Thieving":1500,"Magic":1500},"steps":[[1,"Purchase a steel warhammer at Vigr's Warhammers while in Keldagrim for In Search of the Myreque."],[1,"Steal from the baker's stall on the eastern side of the Keldagrim Palace to complete an easy Fremennik Diary task."],[1,"Browse the Stonemason shop just south of the bank to complete an easy Fremennik Diary task."]],"info":["Join the Purple Pewter while wearing a full set of H.A.M. robes for a 20 point head start during the Consortium section of the quest."]},{"type":"row","id":"Another Slice of H.A.M.","name":"Another Slice of H.A.M.","qp":1,"loc":"Dorgesh-Kaan","link":"Another Slice of H.A.M.","xp":{"Mining":3000,"Prayer":3000},"steps":[[1,"If you already have a mind talisman, craft a tiara and bring both with you during the Goblin Village step of this quest to craft a mind tiara at the nearby Mind Altar for an easy Falador Diary task."]],"info":["The ancient mace is cheap protection for the God Wars Dungeon."]},{"type":"train","skill":"Ranged","lvl":37},{"type":"row","id":"Spirits of the Elid","name":"Spirits of the Elid","qp":2,"loc":"Kharidian Desert","link":"Spirits of the Elid","xp":{"Magic":1000,"Prayer":8000,"Thieving":1000},"steps":[[1,"Bring 10-15 ice coolers to the Water Ravine Dungeon step, and kill level 42 lizards south of the dungeon until they drop a desert lizard bone for Rag and Bone Man II (drop rate is 1/4)."],[1,"When heading to the genie's crevice, complete the following Rag and Bone Man II tasks:"],[2,"Kill jackals outside the crevice until they drop a jackal bone."],[2,"Inside the crevice, kill desert snakes until they drop a snake spine."],[2,"South-west of the crevice, kill vultures until they drop a vulture wing."]]},{"type":"train","skill":"Prayer","lvl":43},{"type":"row","id":"Dragon Slayer I","name":"Dragon Slayer I","qp":2,"loc":"Varrock","link":"Dragon Slayer I","xp":{"Defence":18650,"Strength":18650},"steps":[[1,"While in the Port Sarim jail, talk to the Security Guard on the 1st floor (UK) to receive a Security book for the easy Falador Diary."]],"info":["Starting this quest unlocks dragon tasks for Slayer.","Completing this quest allows you to use green d'hide body, rune platebody and dragon platebody."]},{"type":"row","id":"Horror from the Deep","name":"Horror from the Deep","qp":2,"loc":"Lighthouse","link":"Horror from the Deep","xp":{"Magic":4662.5,"Ranged":4662.5,"Strength":4662.5},"steps":[[1,"After completion of this quest, kill Dagannoth in the Lighthouse dungeon until you obtain Dagannoth ribs for Rag and Bone Man II."]],"info":["Completing this quest allows you to buy God books. The book of war is cheap protection for the God Wars Dungeon."]},{"type":"row","id":"The Garden of Death","name":"The Garden of Death","qp":1,"loc":"Kebos Lowlands","link":"The Garden of Death","xp":{"Farming":10000}},{"type":"row","id":"Enlightened Journey","name":"Enlightened Journey","qp":1,"loc":"Entrana","link":"Enlightened Journey","xp":{"Crafting":2000,"Farming":3000,"Firemaking":4000,"Woodcutting":1500},"info":["Allows use of the balloon transport system.","If the 12 willow branches are obtained from planting Auguste's sapling, you will need to wait 4 hours for the willow tree to grow and then 5 more minutes per branch after checking its health. It may be more desirable to grow your own willow tree before even starting the quest.","If you're growing your own willow tree during this quest, you should obtain an extra 6 willow branches so that you may complete the medium Falador Diary task of crafting a basket on the Falador farm loom."]},{"type":"row","id":"Crafting Guild Balloon","name":"Unlock: Balloon transport system to Crafting Guild","qp":0,"loc":"Entrana","link":"Balloon transport system","xp":{"Firemaking": g Rag and Bone Man II tasks:"],[2,"Kill werewolves in Canifis until you obtain a werewolf bone."],[2,"Kill ghouls west of Canifis until you obtain a ghoul bone."]]},{"type":"row","id":"In Aid of the Myreque","name":"In Aid of the Myreque","qp":2,"loc":"Canifis","link":"In Aid of the Myreque","xp":{"Attack":2000,"Crafting":2000,"Defence":2000,"Strength":2000},"info":["A good tip for lower levels: Using Efaritay's aid allows you to use weapons other than the silver sickle when equipped.","A mithril bar is needed for this quest. One can be easily obtained by killing chaos dwarves in Taverley Dungeon."]},{"type":"train","skill":"Herblore","lvl":30},{"type":"row","id":"Darkness of Hallowvale","name":"Darkness of Hallowvale","qp":2,"loc":"Meiyerditch","link":"Darkness of Hallowvale","xp":{"Agility":7000,"Construction":2000,"Thieving":6000,"Herblore":6000},"info":["Use all three experience rewards on HerbloreHerblore."]},{"type":"row","id":"A Tail of Two Cats","name":"A Tail of Two Cats","qp":2,"loc":"Kharidian Desert","link":"A Tail of Two Cats","xp":{"Herblore":5000},"info":["Use File:Antique lamp.png on HerbloreHerblore."]},{"type":"row","id":"Easy Varrock Diary","name":"Easy Varrock Diary","qp":0,"loc":"","link":"Varrock Diary","xp":{"Herblore":2500},"info":["Use the File:Blessed lamp.png on HerbloreHerblore."]},{"type":"row","id":"Easy Desert Diary","name":"Easy Desert Diary","qp":0,"loc":"","link":"Desert Diary","xp":{"Herblore":2500},"steps":[[1,"Keep a potato cactus for Mourning's End Part II's item list."]],"info":["Use the File:Blessed lamp.png on HerbloreHerblore."]},{"type":"row","id":"Tower of Life","name":"Tower of Life","qp":2,"loc":"Ardougne","link":"Tower of Life","xp":{"Construction":1000,"Crafting":500,"Thieving":500}},{"type":"row","id":"Recipe for Disaster/Freeing Pirate Pete","name":"Recipe for Disaster/Freeing Pirate Pete","qp":1,"loc":"Lumbridge","link":"Recipe for Disaster/Freeing Pirate Pete","xp":{"Cooking":1000,"Crafting":1000,"Fishing":1000,"Sm
